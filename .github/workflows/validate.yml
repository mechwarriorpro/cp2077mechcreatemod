name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Data integrity + generated-output drift + self-containment
        run: python3 tools/validate.py --strict
      - name: Package inputs
        run: python3 tools/build_package.py --check
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dev test dependencies
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Browser smoke test (jsdom) + Lua parse/runtime test (luaparse/fengari)
        working-directory: tools
        run: npm test
